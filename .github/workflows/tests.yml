name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-drive-avoidance"
version = "1.0.0"
description = "Fixed and dynamic YOLO/LiDAR obstacle avoidance for a differential-drive robot"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["jetson", "jetson.*"]
